# CI for the commitment-enforcement layer and the crate as a whole.
# Runs on every pull request so the A_t^valid gate is publicly verified.

name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  standards:
    # The three checks AGENTS.md lists as pre-commit steps, which nothing
    # enforced. Pinned to the toolchain this tree is formatted and linted with,
    # because a gate that goes red when an unrelated stable bump lands is a gate
    # people learn to ignore. The job below stays on floating stable on purpose:
    # that one wants to hear about new compilers.
    name: standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Mojibake
        # A UTF-8 file saved through a single-byte codepage is still valid UTF-8,
        # so nothing else objects to it. That is how src/main.rs reached 3 MB,
        # and how the damage got committed, pushed and shipped in the binary.
        run: python3 scripts/check_mojibake.py --worktree

      - name: Dependency policy
        # Licences and package sources. There is no advisory database available
        # in this job, so this does NOT check for CVEs; CLAIMS.md says so.
        run: python3 scripts/check_dependencies.py --quiet

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: WASM target
        # The library has to build for the browser too. --no-default-features
        # keeps the native binary out of it; that binary needs the `native`
        # feature, and axum, tokio and clap do not compile for wasm32.
        run: |
          cargo check --target wasm32-unknown-unknown --locked --no-default-features \
            --features wasm

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build all targets
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Library tests
        run: cargo test --lib --locked

      - name: Enforcement integration tests (A_t^valid gate)
        run: cargo test --test enforcement_gate --locked

      - name: Core integration tests
        run: cargo test --test integration --locked
