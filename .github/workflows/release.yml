name: release

# On any v* tag push, build Windows, Linux, and WASM release artifacts
# and attach them (plus per-platform SHA256SUMS and commit SHA) to the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  durability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Acknowledged-store and semantic restoration regressions
        run: cargo test --release --locked --features embeddings --test consolidation_durability
      - name: Existing library and integration regressions
        run: |
          cargo test --release --locked --features embeddings --lib
          cargo test --release --locked --features embeddings --test integration
          cargo test --release --locked --features embeddings --test mcp_no_learn
          cargo test --release --locked --features embeddings --test mcp_stdio

      - name: Hook integration against native CLI
        run: MICROSCOPE_TEST_BIN="$PWD/target/release/microscope-mem" node --test integrations/ai-agent-hook/test/hook.test.mjs

  build-windows:
    needs: durability-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release --locked --features embeddings

      - name: Create checksums & package
        shell: bash
        run: |
          cd target/release
          sha256sum microscope-mem.exe > SHA256SUMS.txt
          tar -czf microscope-mem-windows-x86_64.tar.gz microscope-mem.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body: |
            Commit: ${{ github.sha }}
          files: |
            target/release/microscope-mem.exe
            target/release/microscope-mem-windows-x86_64.tar.gz
            target/release/SHA256SUMS.txt

  build-linux:
    needs: durability-gate
    # Ubuntu 22.04 builds against glibc 2.35 so the binary runs on Ubuntu 22.04+
    # without sideloading a newer libc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release --locked --features embeddings

      - name: Package Linux Binary
        run: |
          cd target/release
          cp microscope-mem microscope-mem-linux-x86_64
          sha256sum microscope-mem-linux-x86_64 > SHA256SUMS-linux.txt
          tar -czf microscope-mem-linux-x86_64.tar.gz microscope-mem-linux-x86_64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body: |
            Commit: ${{ github.sha }}
          files: |
            target/release/microscope-mem-linux-x86_64
            target/release/microscope-mem-linux-x86_64.tar.gz
            target/release/SHA256SUMS-linux.txt

  build-wasm:
    needs: durability-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          WANT=$(awk '/^name = "wasm-bindgen"$/{getline; sub(/^version = /, ""); gsub(/[",]/, ""); print; exit}' Cargo.lock)
          if [ -z "$WANT" ]; then
            echo "::error::could not read wasm-bindgen version from Cargo.lock" >&2
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "$WANT" --locked

      - name: Build WASM library & bindings
        run: |
          cargo build --target wasm32-unknown-unknown --release --locked --no-default-features --features wasm
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -1)
          mkdir -p wasm-pkg
          wasm-bindgen "$WASM" --target web --out-dir wasm-pkg
          cd wasm-pkg
          tar -czf ../microscope-memory-wasm.tar.gz *
          cd ..
          sha256sum microscope-memory-wasm.tar.gz > SHA256SUMS-wasm.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            microscope-memory-wasm.tar.gz
            SHA256SUMS-wasm.txt

  publish:
    # Do not expose a partial release if a build, test, or upload fails.
    needs: [build-linux, build-windows, build-wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify all release assets exist before publishing
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for name in microscope-mem.exe microscope-mem-windows-x86_64.tar.gz SHA256SUMS.txt \
            microscope-mem-linux-x86_64 microscope-mem-linux-x86_64.tar.gz SHA256SUMS-linux.txt \
            microscope-memory-wasm.tar.gz SHA256SUMS-wasm.txt; do
            printf '%s\n' "$assets" | grep -Fx -- "$name" > /dev/null || {
              echo "Missing release asset: $name" >&2
              exit 1
            }
          done
      - name: Publish completed release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
