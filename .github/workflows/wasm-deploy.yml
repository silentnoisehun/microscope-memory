name: wasm-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100

      - name: Build WASM binary
        run: |
          # --no-default-features is what keeps the native binary out of the
          # build: its [[bin]] requires the `native` feature, and the axum,
          # tokio and clap dependencies behind it do not compile for wasm32.
          # The library is what ships to the browser.
          cargo build --target wasm32-unknown-unknown --release --locked \
            --no-default-features --features wasm
          echo "=== produced ==="
          find target/ -name "*.wasm" -exec ls -la {} \;
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -1)
          if [ -z "$WASM" ]; then
            echo "::error::cargo build produced no .wasm" >&2
            exit 1
          fi
          if [ ! -s "$WASM" ]; then
            echo "::error::$WASM exists but is empty" >&2
            exit 1
          fi

      - name: Generate JS bindings
        run: |
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -1)
          if [ -z "$WASM" ]; then
            echo "::error::no .wasm to generate bindings from" >&2
            exit 1
          fi
          mkdir -p web-demo/pkg
          wasm-bindgen "$WASM" --target web --out-dir web-demo/pkg
          if [ ! -s web-demo/pkg/microscope_memory.js ]; then
            echo "::error::wasm-bindgen wrote no JavaScript" >&2
            exit 1
          fi
          ls -la web-demo/pkg/

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -r web-demo/* _site/ 2>/dev/null || true
          echo "=== _site/ ==="
          find _site -type f | sort
          echo "Microscope Memory WASM Demo Loaded" > _site/health.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://silentnoisehun.github.io/microscope-memory/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
