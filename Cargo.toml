[package]
name = "microscope-memory"

version = "0.8.2"
edition = "2021"
authors = ["Microscope Contributors"]
description = "Pure binary cognitive memory engine with REST API bridge for LLM integration. Zero-JSON core, mmap-based, hierarchical, sub-microsecond search."
readme = "README.md"
homepage = "https://github.com/silentnoisehun/microscope-memory"
repository = "https://github.com/silentnoisehun/microscope-memory"
license = "MIT"
keywords = ["memory", "llm", "mmap", "vector-search", "api"]
categories = ["data-structures", "algorithms", "memory-management", "web-programming"]
exclude = [
    "layers/*",
    "output/*",
    ".github/*",
    "tests/fixtures/*",
    "tests/data/*",
    "scripts/*",
    "tools/*",
    "*.txt",
    "*.log",
    "errors.txt",
    "compile_errors.txt",
    "test_errors.json",
]


[lib]
name = "microscope_memory"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "microscope-mem"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
half = ">=2.3, <2.5"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
blake3 = "1.5"
thiserror = "1.0"
bincode = "1.3"
toml = "0.8"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1.0"
zstd = { version = "0.13", optional = true }
microscope-hooks = { path = "microscope-hooks" }
epistemic-core = { path = "epistemic-core" }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
rayon = "1.8"
clap = { version = "4", features = ["derive"] }
colored = "2"
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Optional features (native only — must not live under the wasm32 target
# section, otherwise the feature-gated crates are unresolvable on native builds)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1.13", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }
candle-core = { version = "0.3", optional = true, features = [] }
candle-nn = { version = "0.3", optional = true }
candle-transformers = { version = "0.3", optional = true }
hf-hub = { version = "0.3", optional = true }
tokenizers = { version = "0.15", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["native"]
native = []
wasm = []
python = ["dep:pyo3"]
compression = ["zstd"]
gpu = ["wgpu", "bytemuck", "pollster"]
embeddings = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "tokenizers"]
cuda = ["embeddings", "candle-core/cuda"]
onnx = []
console_error_panic_hook = []

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "microscope_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true



[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false


